name: CI

on: [push, pull_request]

env:
  CC: clang
  CXX: clang++
  MIX_ENV: test
  WARNINGS_AS_ERRORS: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.20.4
            otp: 29.1.1
            rebar3: 3.27.1

          - elixir: 1.20.4
            otp: 28.5.0.7
            rebar3: 3.27.1
            lint: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: (Erlang) Check Formatting
        if: ${{ matrix.lint }}
        run: |
          pipx install --force clang-format==22.1.8
          export PATH="$HOME/.local/bin:$PATH"
          clang-format --version
          make lint-format

      - name: (Erlang) eqWAlizer
        if: ${{ matrix.lint }}
        run: make lint-eqwalizer

      - name: (Erlang) Dialyzer
        if: ${{ matrix.lint }}
        run: make lint-dialyzer

      - name: (Erlang) Xref
        if: ${{ matrix.lint }}
        run: make lint-xref

      - name: (Erlang) Tests
        run: |
          rebar3 ct

      - name: (Elixir) Install Mix Tools
        run: |
          mix local.rebar rebar3 "$(command -v rebar3)" --force
          mix local.hex 2.5.1 --force

      - name: (Elixir) Retrieve Mix Dependencies Cache
        uses: actions/cache@v6
        id: mix-cache
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}

      - name: (Elixir) Install Mix Dependencies
        run: |
          mix deps.get

      - name: (Elixir) Check Formatting
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: (Elixir) Tests
        run: mix test --trace

      - name: Logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ct-logs-${{ matrix.otp }}-${{ matrix.elixir }}
          path: _build/test/logs/
